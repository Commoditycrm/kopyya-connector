name: release

# Push a tag like v0.1.0 to build the Connector and publish a GitHub release.
# Kopyya links to releases/latest, so traders always get the newest build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: Kopyya-Connector-Windows.exe
          - os: macos-latest
            asset: Kopyya-Connector-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - run: pip install -r requirements-desktop.txt pyinstaller==6.11.1

      # No bundled Chromium: the app drives the user's installed Chrome/Edge.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --collect-all playwright --name Kopyya-Connector-Windows connector.py
          move dist\Kopyya-Connector-Windows.exe ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --collect-all playwright --name "Kopyya Connector" connector.py
          ditto -c -k --keepParent "dist/Kopyya Connector.app" ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
